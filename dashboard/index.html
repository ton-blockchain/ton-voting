    <style>
      :root {
        --bg: #f4f0e8;
        --bg-strong: #e8dfcf;
        --card: rgba(255, 252, 246, 0.82);
        --card-strong: rgba(255, 248, 238, 0.94);
        --ink: #1d1a17;
        --muted: #62584f;
        --line: rgba(29, 26, 23, 0.12);
        --accent: #0c7c59;
        --accent-soft: rgba(12, 124, 89, 0.14);
        --warn: #a44a3f;
        --critical: #912d1f;
        --shadow: 0 20px 50px rgba(68, 46, 20, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(217, 191, 123, 0.4), transparent 34%),
          radial-gradient(circle at top right, rgba(12, 124, 89, 0.16), transparent 26%),
          linear-gradient(180deg, #fbf7ef 0%, var(--bg) 100%);
        min-height: 100vh;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(29, 26, 23, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(29, 26, 23, 0.02) 1px, transparent 1px);
        background-size: 22px 22px;
        pointer-events: none;
        opacity: 0.45;
      }

      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 32px 20px 72px;
        position: relative;
      }

      .hero,
      .proposal,
      .empty,
      .error {
        backdrop-filter: blur(10px);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: var(--shadow);
      }

      .hero {
        padding: 28px;
        position: relative;
        overflow: hidden;
      }

      .hero::after {
        content: "";
        position: absolute;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(12, 124, 89, 0.18), transparent 70%);
        top: -70px;
        right: -50px;
        pointer-events: none;
      }

      .hero-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        position: relative;
        z-index: 1;
      }

      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 8px;
      }

      h1,
      h2,
      h3 {
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
        margin: 0;
        font-weight: 600;
        line-height: 0.96;
      }

      h1 {
        font-size: clamp(2.5rem, 8vw, 5rem);
        max-width: 10ch;
      }

      .hero-copy {
        max-width: 64ch;
        margin-top: 16px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .stats {
        margin-top: 28px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 14px;
      }

      .stat {
        padding: 16px 18px;
        border-radius: 20px;
        background: var(--card-strong);
        border: 1px solid rgba(29, 26, 23, 0.08);
      }

      .stat-label {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .stat-value {
        display: block;
        font-size: 1.7rem;
        margin-top: 8px;
        line-height: 1.05;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 16px;
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .proposal > .meta > span {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        line-height: 1.2;
      }

      .meta-link {
        color: #2296f3;
        text-decoration: none;
      }

      .meta-link:hover {
        text-decoration: underline;
      }

      .actions {
        margin-top: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      button,
      a.button-link {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        color: var(--ink);
        background: #fdf9f0;
        border: 1px solid rgba(29, 26, 23, 0.12);
        cursor: pointer;
        transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
      }

      button:hover,
      a.button-link:hover {
        transform: translateY(-1px);
        background: white;
      }

      .button-primary {
        background: var(--accent);
        color: white;
        border-color: transparent;
      }

      .button-primary:hover {
        background: #0a694b;
      }

      .copy-hash {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 7px 12px;
        border-radius: 999px;
        border: 1px solid rgba(29, 26, 23, 0.12);
        background: rgba(255, 255, 255, 0.68);
        color: var(--ink);
        line-height: 1.2;
      }

      .copy-hash:hover {
        background: white;
      }

      .copy-hash.copied {
        border-color: rgba(12, 124, 89, 0.28);
        background: rgba(12, 124, 89, 0.12);
      }

      .copy-label {
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--muted);
      }

      .made-by {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 999px;
        border: 1px solid rgba(29, 26, 23, 0.12);
        background: rgba(255, 255, 255, 0.58);
        color: var(--muted);
        text-decoration: none;
        white-space: nowrap;
        transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
        position: relative;
        z-index: 1;
      }

      .made-by:hover {
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.86);
      }

      .made-by strong {
        color: var(--ink);
        font-weight: 600;
      }

      .telegram-icon {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        color: #229ed9;
      }

      .section {
        margin-top: 26px;
      }

      .section-title {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 14px;
      }

      .section-title p {
        margin: 0;
        color: var(--muted);
      }

      .proposal-list {
        display: grid;
        gap: 18px;
      }

      .proposal {
        padding: 24px;
        transform: translateY(14px);
        opacity: 0;
        animation: rise 420ms ease forwards;
      }

      .proposal:nth-child(2) {
        animation-delay: 80ms;
      }

      .proposal:nth-child(3) {
        animation-delay: 160ms;
      }

      @keyframes rise {
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .proposal-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }

      .proposal-head > .chips {
        justify-content: flex-end;
        margin-top: 8px;
        max-width: 50%;
      }

      .proposal-title {
        font-size: clamp(1.6rem, 4vw, 2.4rem);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 0.88rem;
        background: rgba(29, 26, 23, 0.06);
        color: var(--muted);
        text-decoration: none;
      }

      .chip.critical {
        background: rgba(145, 45, 31, 0.12);
        color: var(--critical);
      }

      .chip.good {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .chip.mtonga {
        background: var(--accent-soft);
        border: 1px solid rgba(12, 124, 89, 0.28);
        color: var(--accent);
        font-weight: 600;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      .chip.mtonga::after {
        content: "↗";
        font-size: 0.78em;
        line-height: 1;
      }

      .chip.mtonga:hover {
        background: rgba(12, 124, 89, 0.2);
        border-color: rgba(12, 124, 89, 0.42);
      }

      .chip.independent {
        background: rgba(145, 45, 31, 0.12);
        color: var(--critical);
      }

      .summary {
        white-space: pre-line;
        margin: 18px 0 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .progress-panel {
        margin-top: 22px;
        padding: 18px;
        border-radius: 22px;
        background: var(--card-strong);
        border: 1px solid rgba(29, 26, 23, 0.08);
      }

      .progress-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
        margin-bottom: 12px;
      }

      .progress-top strong {
        font-size: 1.2rem;
      }

      .progress-track {
        position: relative;
        height: 16px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(29, 26, 23, 0.08);
      }

      .progress-fill {
        position: relative;
        z-index: 1;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0c7c59 0%, #d28f35 100%);
        transition: width 240ms ease;
      }

      .progress-threshold {
        position: absolute;
        left: 75%;
        top: -6px;
        bottom: -6px;
        width: 2px;
        border-radius: 999px;
        background: rgba(29, 26, 23, 0.45);
        z-index: 2;
      }

      .progress-threshold-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.84rem;
      }

      .progress-threshold-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: rgba(29, 26, 23, 0.45);
      }

      .metric-grid {
        margin-top: 18px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }

      .metric {
        padding: 14px 16px;
        border-radius: 18px;
        background: rgba(29, 26, 23, 0.035);
      }

      .metric span {
        display: block;
      }

      .metric .label {
        display: inline-flex;
        align-items: flex-start;
        gap: 6px;
        color: var(--muted);
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .info-dot {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
        margin-top: 1px;
        color: var(--muted);
        cursor: help;
      }

      .info-dot svg {
        display: block;
        width: 18px;
        height: 18px;
      }

      .info-dot::after {
        content: attr(data-tooltip);
        position: absolute;
        left: 50%;
        bottom: calc(100% + 8px);
        width: min(240px, 70vw);
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(29, 26, 23, 0.92);
        color: #fffaf2;
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0;
        line-height: 1.35;
        opacity: 0;
        pointer-events: none;
        text-transform: none;
        transform: translate(-50%, 4px);
        transition: opacity 160ms ease, transform 160ms ease;
        z-index: 5;
      }

      .info-dot:hover::after,
      .info-dot:focus-visible::after {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .metric .value {
        margin-top: 8px;
        font-size: 1.22rem;
      }

      .change-grid {
        margin-top: 20px;
        display: grid;
        grid-template-columns: minmax(120px, max-content) minmax(320px, max-content) minmax(320px, max-content);
        gap: 10px;
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
      }

      .change-row {
        display: contents;
        padding: 14px;
        border-radius: 18px;
        background: rgba(29, 26, 23, 0.035);
        border: 1px solid rgba(29, 26, 23, 0.06);
      }

      .change-row strong {
        font-size: 0.92rem;
      }

      .change-label {
        color: var(--muted);
      }

      .change-box {
        padding: 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.55);
        line-height: 1.5;
        white-space: pre-line;
      }

      .change-box.proposed {
        background: rgba(12, 124, 89, 0.08);
      }

      .empty,
      .error {
        padding: 22px;
        color: var(--muted);
      }

      .empty h3 {
        margin: 0 0 10px;
        font-size: 1.6rem;
        color: var(--ink);
      }

      .empty p {
        margin: 0;
        line-height: 1.7;
      }

      .empty-grid {
        margin-top: 18px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
      }

      .empty-metric {
        padding: 14px 16px;
        border-radius: 18px;
        background: rgba(29, 26, 23, 0.035);
      }

      .empty-metric span {
        display: block;
      }

      .empty-metric .label {
        color: var(--muted);
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .empty-metric .value {
        margin-top: 8px;
        font-size: 1.1rem;
        color: var(--ink);
      }

      #resolved-list:not(.empty) {
        display: grid;
        gap: 18px;
        margin-top: 18px;
      }

      .resolved-card {
        margin-top: 18px;
        padding: 18px;
        border-radius: 22px;
        background: rgba(12, 124, 89, 0.08);
        border: 1px solid rgba(12, 124, 89, 0.16);
      }

      #resolved-list:not(.empty) .resolved-card {
        margin-top: 0;
      }

      .resolved-card h4 {
        margin: 10px 0 0;
        font-size: 1.2rem;
        color: var(--ink);
      }

      .resolved-card p + p {
        margin-top: 10px;
      }

      .footer {
        margin-top: 20px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .mono {
        font-family: "SFMono-Regular", "JetBrains Mono", "Menlo", monospace;
        font-size: 0.92em;
      }

      @media (max-width: 760px) {
        main {
          padding: 18px 14px 48px;
        }

        .hero,
        .proposal,
        .empty,
        .error {
          border-radius: 22px;
        }

        .change-row {
          grid-template-columns: 1fr;
        }

        .proposal-head,
        .progress-top,
        .section-title {
          flex-direction: column;
          align-items: flex-start;
        }

        .proposal-head > .chips {
          justify-content: flex-start;
          max-width: none;
        }

        .hero-top {
          flex-direction: column;
        }

      }

      :root {
        --bg: #fff;
        --bg-strong: #f0f6fa;
        --card: #fff;
        --card-strong: #f7fbfe;
        --ink: #000;
        --muted: #697680;
        --line: #e5e5e5;
        --accent: #0486d1;
        --accent-soft: #e5f1fa;
        --warn: #c05a4a;
        --critical: #c44336;
        --shadow: none;
      }

      body {
        font-family: Helvetica, Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        background: var(--bg);
        color: var(--ink);
      }

      body::before {
        content: none;
      }

      body::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        height: 50px;
        background: rgba(255, 255, 255, 0.84);
        border-bottom: 1px solid #e8e8e8;
        backdrop-filter: blur(25px);
        pointer-events: none;
      }

        padding: 82px 15px 0;
      }

        align-items: center;
        height: 50px;
        color: var(--accent);
        font-size: 15px;
        font-weight: 700;
        pointer-events: none;
      }

      .hero,
      .proposal,
      .empty,
      .error {
        backdrop-filter: none;
        background: var(--card);
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .hero {
        padding: 0 19px 30px;
        border-bottom: 1px solid var(--line);
        overflow: visible;
      }

      .hero::after {
        content: none;
      }

      .hero-top {
        align-items: center;
        overflow: visible;
        z-index: auto;
      }

      .eyebrow {
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: none;
      }

      h1,
      h2,
      h3 {
        font-family: Helvetica, Arial, sans-serif;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: 0;
      }

      h1 {
        max-width: none;
        font-size: 30px;
        line-height: 36px;
      }

      h2 {
        font-size: 25px;
        line-height: 30px;
      }

      h3 {
        font-size: 20px;
        line-height: 25px;
      }

      .hero-copy {
        max-width: 760px;
        margin: 16px 0 0;
        color: #333;
        font-size: 16px;
        line-height: 24px;
      }

      .stats {
        margin-top: 28px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
      }

      .stat {
        min-height: 128px;
        padding: 28px 18px;
        border: 0;
        border-radius: 16px;
        background: var(--bg-strong);
        text-align: center;
      }

      .stat-label,
      .metric .label,
      .empty-metric .label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 0;
        line-height: 17px;
        text-transform: none;
      }

      .stat-value {
        margin-top: 12px;
        color: var(--accent);
        font-size: 34px;
        font-weight: 700;
        line-height: 34px;
      }

      .meta {
        gap: 9px 18px;
        color: var(--muted);
        font-size: 15px;
        line-height: 20px;
      }

      .meta-link,
      a {
        color: var(--accent);
      }

      .actions {
        gap: 10px;
        margin-top: 22px;
      }

      button,
      a.button-link {
        min-height: 42px;
        border: 1px solid #cfe5f5;
        border-radius: 999px;
        background: #fff;
        color: var(--accent);
        font-size: 15px;
        font-weight: 700;
        line-height: 20px;
        transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease;
      }

      button:hover,
      a.button-link:hover {
        transform: none;
        background: var(--accent-soft);
        border-color: #b9d9ee;
        text-decoration: none;
      }

      .button-primary {
        background: #1d98dc;
        border-color: #1d98dc;
        color: #fff;
      }

      .button-primary:hover {
        background: #0e8ed4;
        border-color: #0e8ed4;
      }

      .made-by {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        position: fixed;
        top: 7px;
        right: max(15px, calc((100vw - 1170px) / 2 + 15px));
        z-index: 1000;
        visibility: visible;
        opacity: 1;
        min-height: 36px;
        padding: 7px 13px;
        border: 1px solid rgba(62, 166, 240, 0.24);
        border-radius: 999px;
        background: rgba(62, 166, 240, 0.12);
        box-shadow: 0 1px 4px rgba(4, 134, 209, 0.1);
        color: var(--accent);
        font-size: 15px;
        line-height: 20px;
        text-decoration: none;
        white-space: nowrap;
      }

      .made-by:hover {
        transform: none;
        background: rgba(62, 166, 240, 0.2);
        border-color: rgba(62, 166, 240, 0.36);
        text-decoration: none;
      }

      .made-by strong {
        color: var(--accent);
      }

      .made-by span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .telegram-icon {
        color: #229ed9;
      }

      .section {
        margin-top: 52px;
        padding: 0 19px;
      }

      .section-title {
        margin-bottom: 22px;
      }

      .section-title p {
        color: var(--muted);
        font-size: 16px;
      }

      .proposal-list {
        gap: 30px;
      }

      .proposal {
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }

      .proposal:has(.info-dot:hover),
      .proposal:has(.info-dot:focus-visible) {
        overflow: visible;
      }

      .proposal-head,
      .proposal > .chips,
      .proposal > .summary,
      .proposal > .meta {
        padding-left: 24px;
        padding-right: 24px;
      }

      .proposal > .meta,
      .resolved-card > .meta {
        padding-bottom: 28px;
      }

      .proposal-head {
        padding-top: 24px;
      }

      .proposal-title {
        font-size: 25px;
        line-height: 30px;
      }

      .chips {
        gap: 8px;
        margin-top: 14px;
      }

      .chip {
        min-height: 30px;
        padding: 5px 12px;
        border: 0;
        border-radius: 999px;
        background: var(--bg-strong);
        color: var(--accent);
        font-size: 14px;
        line-height: 20px;
      }

      .chip.good,
      .chip.mtonga {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .chip.critical,
      .chip.independent {
        background: #fff0ef;
        color: var(--critical);
      }

      .chip.mtonga {
        border: 0;
        font-weight: 700;
        text-decoration: none;
      }

      .chip.mtonga:hover {
        background: #d4eafa;
      }

      .summary {
        color: #333;
        font-size: 16px;
        line-height: 24px;
      }

      .progress-panel {
        margin: 24px;
        padding: 18px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
      }

      .progress-top strong {
        color: var(--accent);
        font-size: 22px;
      }

      .progress-track {
        height: 18px;
        background: var(--bg-strong);
      }

      .progress-fill {
        background: #3ea6f0;
      }

      .progress-threshold {
        background: #697680;
      }

      .progress-threshold-label {
        color: var(--muted);
      }

      .progress-threshold-dot {
        background: #697680;
      }

      .metric-grid,
      .empty-grid {
        gap: 1px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--line);
      }

      .metric-grid {
        position: relative;
        z-index: 2;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-auto-rows: minmax(86px, auto);
        overflow: hidden;
      }

      .metric-grid::after {
        content: "";
        display: block;
        background: #fff;
      }

      .metric-grid:has(.info-dot:hover),
      .metric-grid:has(.info-dot:focus-visible) {
        overflow: visible;
      }

      .empty-grid {
        overflow: hidden;
      }

      .metric {
        position: relative;
        padding: 12px 16px;
        border-radius: 0;
        background: #fff;
      }

      .metric .value,
      .empty-metric .value {
        color: #000;
        font-size: 18px;
        font-weight: 700;
        line-height: 23px;
      }

      .info-dot {
        color: var(--accent);
        z-index: 10;
      }

      .info-dot::after {
        border-radius: 8px;
        background: #2f3942;
        color: #fff;
        z-index: 999;
      }

      .change-grid {
        display: grid;
        grid-template-columns: minmax(150px, max-content) minmax(420px, max-content) minmax(420px, max-content);
        gap: 0;
        margin: 24px;
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--accent-soft);
      }

      .change-row {
        display: contents;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
      }

      .change-label,
      .change-box {
        padding: 14px 16px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: #fff;
      }

      .change-label {
        color: #333;
      }

      .change-box {
        border-radius: 0;
        color: #333;
      }

      .change-box.proposed {
        border-right: 0;
        background: var(--accent-soft);
      }

      .change-row:last-child > .change-label,
      .change-row:last-child > .change-box {
        border-bottom: 0;
      }

      .change-box .change-prefix {
        font-size: inherit;
        font-weight: 700;
      }

      .change-box:has(> .contract-code-change) {
        display: flex;
        white-space: normal;
      }

      .contract-code-change {
        display: flex;
        flex: 1;
        min-width: 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        white-space: normal;
      }

      .contract-code-stage {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        line-height: 1;
        text-transform: uppercase;
      }

      .contract-code-title {
        color: var(--ink);
        font-size: 16px;
        line-height: 1.3;
      }

      .contract-code-detail {
        flex: 1;
        max-width: 48ch;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .contract-code-source {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 2px;
        padding: 8px 11px;
        border: 1px solid #cfe5f5;
        border-radius: 9px;
        background: #fff;
        color: var(--accent);
        font-size: 13px;
        font-weight: 800;
        line-height: 1;
        text-decoration: none;
      }

      .contract-code-source:hover {
        border-color: #9ec8e5;
        background: #f8fcff;
      }

      .contract-code-hash {
        display: flex;
        width: 100%;
        min-width: 0;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 3px;
        padding: 9px 10px;
        border: 1px solid rgba(12, 124, 89, 0.15);
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.72);
      }

      .contract-code-hash-label {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .contract-code-hash .copy-hash {
        min-width: 0;
        max-width: 250px;
      }

      .contract-code-hash .mono {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .copy-hash {
        min-height: 34px;
        padding: 6px 11px;
        border: 1px solid #cfe5f5;
        background: #fff;
        color: var(--accent);
      }

      .copy-hash:hover {
        background: var(--accent-soft);
      }

      .copy-hash.copied {
        border-color: #b9d9ee;
        background: var(--accent-soft);
      }

      .copy-label {
        color: var(--accent);
      }

      .empty,
      .error {
        padding: 22px 24px;
        border-radius: 12px;
        background: var(--bg-strong);
        color: #333;
      }

      .error {
        background: #fff0ef;
        color: var(--critical);
      }

      .empty h3 {
        font-size: 20px;
        line-height: 25px;
      }

      .empty-metric {
        padding: 14px 16px;
        border-radius: 0;
        background: #fff;
      }

      .resolved-card {
        margin-top: 0;
        padding: 24px 0 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
      }

      .resolved-card > .chips,
      .resolved-card > h4,
      .resolved-card > p,
      .resolved-card > .meta {
        padding-left: 24px;
        padding-right: 24px;
      }

      .resolved-card h4 {
        color: #000;
        font-size: 20px;
        line-height: 25px;
      }

      .resolved-card p {
        color: #333;
        font-size: 16px;
        line-height: 24px;
      }

      .featured-resolved {
        padding: 0;
        overflow: hidden;
      }

      .featured-resolved > .summary {
        margin-top: 14px;
      }

      .resolved-status-panel {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        margin: 22px 24px 0;
        padding: 16px 18px;
        border: 1px solid rgba(12, 124, 89, 0.2);
        border-radius: 12px;
        background: var(--accent-soft);
      }

      .resolved-status-icon {
        display: grid;
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        place-items: center;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-size: 18px;
        font-weight: 900;
      }

      .resolved-status-copy {
        min-width: 0;
      }

      .resolved-status-copy strong {
        display: block;
        color: var(--ink);
        font-size: 16px;
        line-height: 22px;
      }

      .resolved-status-copy p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 20px;
      }

      .resolved-proposal-tabs .proposal-tab {
        border-color: var(--accent);
        background: #fff;
        color: var(--accent);
        cursor: default;
      }

      .footer {
        width: 100vw;
        margin: 60px 0 0 50%;
        padding: 34px max(15px, calc((100vw - 1170px) / 2 + 34px)) 44px;
        transform: translateX(-50%);
        background: var(--bg-strong);
        box-shadow: 0 -1px #e8e8e8;
        color: #333;
        font-size: 16px;
        line-height: 24px;
      }

      .mono {
        font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
      }

      .proposal-tabs {
        display: flex;
        gap: 4px;
        margin: 24px 24px 0;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
      }

      .proposal-tab {
        min-height: 42px;
        padding: 8px 16px;
        border: 2px solid transparent;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-size: 15px;
        font-weight: 700;
      }

      .proposal-tab:hover {
        border-color: #b9def5;
        background: #f4faff;
        color: var(--accent);
      }

      .proposal-tab[aria-selected="true"] {
        border-color: var(--accent);
        background: #fff;
        color: var(--accent);
      }

      .voter-panel {
        margin: 20px 24px 24px;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
      }

      .voter-toolbar {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        padding: 18px;
        background: var(--accent-soft);
        border-bottom: 1px solid var(--line);
      }

      .voter-search-label {
        display: grid;
        gap: 7px;
        width: min(620px, 100%);
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .voter-search {
        width: 100%;
        min-height: 42px;
        padding: 9px 12px;
        border: 1px solid #c9d8e2;
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font: inherit;
      }

      .voter-search:focus {
        border-color: var(--accent);
        outline: 3px solid rgba(0, 122, 204, 0.12);
      }

      .voter-match-count {
        flex: 0 0 auto;
        padding-bottom: 10px;
        color: var(--accent);
        font-weight: 700;
      }

      .voter-note,
      .voter-empty,
      .voter-no-results {
        margin: 0;
        padding: 14px 18px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .voter-note {
        border-bottom: 1px solid var(--line);
      }

      .voter-no-results {
        color: var(--ink);
        font-weight: 700;
      }

      .voter-table-wrap {
        max-height: 560px;
        overflow: auto;
      }

      .voter-table {
        width: 100%;
        min-width: 1040px;
        border-collapse: collapse;
        font-size: 14px;
      }

      .voter-table th,
      .voter-table td {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: middle;
      }

      .voter-table th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #f7f9fa;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .voter-table tr:last-child td {
        border-bottom: 0;
      }

      .voter-table tr:hover td {
        background: #f8fbfd;
      }

      .voter-id {
        color: var(--ink);
        white-space: nowrap;
      }

      .voter-copy {
        max-width: 270px;
      }

      .voter-copy .mono {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .voter-role {
        display: inline-flex;
        padding: 4px 8px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      .voter-weight {
        white-space: nowrap;
      }

      .voter-weight small {
        display: block;
        margin-top: 2px;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .metric-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          grid-auto-rows: auto;
        }

        .metric-grid::after {
          content: none;
        }
      }

      @media (max-width: 760px) {
        body::after {
          height: 48px;
        }

        main {
          padding: 68px 0 0;
        }

        main::before {
          left: 16px;
          height: 48px;
        }

        .hero,
        .section {
          padding-left: 16px;
          padding-right: 16px;
        }

        .hero,
        .proposal,
        .empty,
        .error {
          border-radius: 0;
        }

        .proposal,
        .resolved-card {
          border-left: 0;
          border-right: 0;
        }

        .stats {
          grid-template-columns: 1fr;
        }

        .metric-grid {
          grid-template-columns: 1fr;
          grid-auto-rows: auto;
        }

        .stat {
          min-height: 0;
          padding: 22px 18px;
        }

        .proposal-head,
        .proposal > .chips,
        .proposal > .summary,
        .proposal > .meta,
        .resolved-card > .chips,
        .resolved-card > h4,
        .resolved-card > p,
        .resolved-card > .meta {
          padding-left: 16px;
          padding-right: 16px;
        }

        .proposal > .meta,
        .resolved-card > .meta {
          padding-bottom: 24px;
        }

        .progress-panel,
        .resolved-status-panel,
        .change-grid {
          margin-left: 16px;
          margin-right: 16px;
        }

        .proposal-tabs {
          margin-left: 16px;
          margin-right: 16px;
        }

        .voter-panel {
          margin-left: 16px;
          margin-right: 16px;
        }

        .voter-toolbar {
          align-items: stretch;
          flex-direction: column;
        }

        .voter-match-count {
          padding-bottom: 0;
        }

        .change-grid {
          grid-template-columns: minmax(140px, max-content) minmax(320px, max-content) minmax(320px, max-content);
        }

        .made-by {
          right: 8px;
          max-width: calc(100vw - 150px);
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .made-by strong {
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .footer {
          padding: 28px 16px 36px;
        }
      }

      @media (max-width: 520px) {
        .made-by {
          gap: 6px;
          max-width: calc(100vw - 176px);
          min-height: 34px;
          padding: 6px 10px;
          font-size: 14px;
          line-height: 18px;
        }

        .made-by span {
          font-size: 0;
        }

        .made-by strong {
          display: inline-block;
          max-width: 100%;
          font-size: 14px;
          line-height: 18px;
          vertical-align: top;
        }

        .telegram-icon {
          width: 17px;
          height: 17px;
        }
      }
      #connection-status:empty { display: none; }
      #connection-status { margin-bottom: 18px; }
      button:disabled { cursor: wait; opacity: 0.65; }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="hero-top">
          <div>
            <p class="eyebrow">TON Mainnet Governance</p>
            <h1>Config voting live</h1>
          </div>
          <a class="made-by" href="https://t.me/lagus_research" target="_blank" rel="noreferrer">
            <svg class="telegram-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M21.4 4.6a2 2 0 0 0-2.1-.3L3.8 10.7a1.5 1.5 0 0 0 .1 2.8l3.8 1.2 1.5 4.9a1.5 1.5 0 0 0 2.6.5l2.2-2.7 3.8 2.8a1.9 1.9 0 0 0 3-1.1l2.6-13a2 2 0 0 0-1-2.2Zm-3 2.7-8.2 7.3a1 1 0 0 0-.3.5l-.5 2.3-.9-3 9.9-8.1Zm-11 5.9-2.1-.7 11.7-5-9.6 5.7Zm12.1 5.8-4.7-3.5a1 1 0 0 0-1.4.2l-1.8 2.2.6-2.6 8-7.1Z"/>
            </svg>
            <span>made by <strong>@lagus_research</strong></span>
          </a>
        </div>
        <p class="hero-copy">
          This page reads the real mainnet config contract on every refresh and turns validator weight, rounds,
          and proposal payloads into plain English.
        </p>
        <div class="stats" id="hero-stats"></div>
        <div class="meta" id="hero-meta"></div>
        <div class="actions">
          <button class="button-primary" id="refresh-button" type="button">Refresh now</button>
          <a class="button-link" id="actonscan-link" href="https://actonscan.com/config" target="_blank" rel="noreferrer">Open Actonscan config</a>
        </div>
      </section>

      <section class="section">
        <div class="section-title">
          <div>
            <h2>Active proposals</h2>
          </div>
          <p id="proposal-counter"></p>
        </div>
        <div id="connection-status" role="status" aria-live="polite"></div>
        <div id="status"></div>
        <div class="proposal-list" id="proposal-list"></div>
      </section>

      <section class="section">
        <div class="section-title">
          <div>
            <h2>Resolved proposals</h2>
          </div>
          <p id="resolved-counter"></p>
        </div>
        <div id="resolved-list"></div>
      </section>

      <p class="footer" id="footer-note"></p>
    </main>

    <script type="module" src="./assets/dashboard.js"></script>
  </body>
</html>
